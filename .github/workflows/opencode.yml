name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Start retry proxy
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
        run: |
          cat > /tmp/proxy.py << 'PYEOF'
          import http.server, urllib.request, urllib.error
          import json, os, time, ssl, threading, itertools, sys

          UPSTREAM = "https://integrate.api.nvidia.com"
          PORT = 4445
          MAX_RETRIES = 0  # 0 = unlimited
          BASE_DELAY = 30

          keys = [k for k in [os.environ.get("NVIDIA_API_KEY"), os.environ.get("NVIDIA_API_KEY_1")] if k]
          if not keys:
              print("[proxy] ERROR: no API keys found", flush=True)
              sys.exit(1)
          key_cycle = itertools.cycle(keys)
          key_lock = threading.Lock()

          def next_key():
              with key_lock:
                  return next(key_cycle)

          ctx = ssl.create_default_context()

          def _is_rate_limit_error(data: bytes) -> bool:
              """Check if a response chunk contains a ResourceExhausted error."""
              try:
                  text = data.decode("utf-8", errors="replace")
                  # SSE stream: data: {"error": ...}
                  for line in text.splitlines():
                      line = line.strip()
                      if line.startswith("data:"):
                          payload = line[5:].strip()
                          if not payload or payload == "[DONE]":
                              continue
                          try:
                              obj = json.loads(payload)
                          except json.JSONDecodeError:
                              continue
                          err = obj.get("error", {})
                          msg = (err.get("message", "") if isinstance(err, dict) else str(err))
                          if "ResourceExhausted" in msg or "request limit" in msg.lower():
                              return True
                      # Non-SSE JSON error body
                      elif line.startswith("{"):
                          try:
                              obj = json.loads(line)
                              err = obj.get("error", {})
                              msg = (err.get("message", "") if isinstance(err, dict) else str(err))
                              if "ResourceExhausted" in msg or "request limit" in msg.lower():
                                  return True
                          except json.JSONDecodeError:
                              pass
              except Exception:
                  pass
              return False

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  pass

              def do_GET(self):
                  self._proxy(None)

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(length) if length else b""
                  self._proxy(body)

              def _proxy(self, body):
                  url = UPSTREAM + self.path
                  delay = BASE_DELAY

                  for attempt in itertools.count():
                      key = next_key()
                      fwd = {k: v for k, v in self.headers.items()
                             if k.lower() not in ("host", "authorization", "content-length")}
                      fwd["Authorization"] = f"Bearer {key}"
                      fwd["Host"] = "integrate.api.nvidia.com"
                      if body is not None:
                          fwd["Content-Length"] = str(len(body))

                      req = urllib.request.Request(
                          url, data=body, headers=fwd, method=self.command)
                      try:
                          resp = urllib.request.urlopen(req, context=ctx, timeout=600)
                      except urllib.error.HTTPError as e:
                          if e.code in (429, 503):
                              print(f"[proxy] HTTP {e.code} attempt {attempt+1}, "
                                    f"retry in {delay}s", flush=True)
                              time.sleep(delay)
                              delay = min(delay * 2, 60)
                              continue
                          self.send_response(e.code)
                          self.end_headers()
                          self.wfile.write(e.read())
                          return
                      except Exception as e:
                          print(f"[proxy] connection error attempt {attempt+1}: {e}", flush=True)
                          time.sleep(delay)
                          delay = min(delay * 2, 60)
                          continue

                      # Read the first chunk to check for ResourceExhausted
                      first_chunk = resp.read(4096)
                      if _is_rate_limit_error(first_chunk):
                          print(f"[proxy] ResourceExhausted attempt {attempt+1}, "
                                f"retry in {delay}s", flush=True)
                          time.sleep(delay)
                          delay = min(delay * 2, 60)
                          continue

                      # Good response — forward headers then stream the rest
                      self.send_response(resp.status)
                      for k, v in resp.headers.items():
                          if k.lower() not in ("transfer-encoding",):
                              self.send_header(k, v)
                      self.end_headers()
                      try:
                          self.wfile.write(first_chunk)
                          while True:
                              chunk = resp.read(65536)
                              if not chunk:
                                  break
                              self.wfile.write(chunk)
                          self.wfile.flush()
                      except (BrokenPipeError, ConnectionResetError):
                          pass
                      return

          server = http.server.ThreadingHTTPServer(("127.0.0.1", PORT), Handler)
          print(f"[proxy] listening on {PORT}", flush=True)
          server.serve_forever()
          PYEOF

          python3 /tmp/proxy.py &
          echo $! > /tmp/proxy.pid

          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:4445/v1/models > /dev/null 2>&1; then
              echo "proxy up"
              exit 0
            fi
            sleep 1
          done
          echo "proxy failed to start"
          exit 1

      - name: Write opencode provider config
        env:
          NVIDIA_MODEL_CONTEXT_WINDOW: ${{ secrets.NVIDIA_MODEL_CONTEXT_WINDOW || '1048576' }}
        run: |
          cat > opencode.json <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM (rate limited)",
                "options": {
                  "baseURL": "http://127.0.0.1:4445/v1",
                  "apiKey": "unused-injected-by-nginx"
                },
                "models": {
                  "nvidia/nemotron-3-ultra-550b-a55b": {
                    "limit": {
                      "context": ${NVIDIA_MODEL_CONTEXT_WINDOW},
                      "output": 8192
                    }
                  }
                }
              }
            }
          }
          EOF

      - name: Install opencode
        run: |
          VERSION=$(curl -sf https://api.github.com/repos/anomalyco/opencode/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          echo "Installing opencode ${VERSION:-latest}"
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run opencode
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: nvidia/nvidia/nemotron-3-ultra-550b-a55b
          USE_GITHUB_TOKEN: "true"
          AGENT: ""
          SHARE: ""
          PROMPT: ""
          MENTIONS: ""
          VARIANT: ""
          OIDC_BASE_URL: ""
        run: opencode github run

      - name: Show proxy logs
        if: always()
        run: kill $(cat /tmp/proxy.pid 2>/dev/null) 2>/dev/null || true
